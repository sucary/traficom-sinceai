[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traficom-sinceai"
version = "0.1.0"
description = "Satellite risk assessment data preparation and analysis backend"
requires-python = ">=3.11"
dependencies = [
    "access-parser==0.0.6",
    "openpyxl==3.1.5",
    "Py1546 @ git+https://github.com/eeveetza/Py1546.git@e235629009ab1a12a33fc4a8fb5612f2883ecb5b",
    "psycopg[binary]==3.3.8",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.scripts]
app = "app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
app = ["db/migrations/*.sql", "reference/*.json", "reference/*.geojson"]
